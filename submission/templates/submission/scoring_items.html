{% extends "base.html" %}
{% load static %}

{% block title %}評価項目編集画面{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'submission/css/fade.css' %}">
<link rel="stylesheet" href="{% static 'submission/css/scoring_items.css' %}">
{% endblock %}

{% block content %}
<div class="p-4">
  <h2 class="mb-4">評価項目編集画面</h2>
  <div id="scoring-items-app">
  <div class="mb-3">
    <label class="form-label">科目</label>
    <select class="form-select" v-model="selectedCourseId" @change="changeCourse">
      {% verbatim %}
      <option v-for="course in courses" :key="course.id" :value="String(course.id)">
        {{ course.course_code }} {{ course.course_name }}
      </option>
      {% endverbatim %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">共通 / 年度</label>
    <select class="form-select" v-model="selectedScope" @change="changeScope">
      <option value="common">共通</option>
      {% verbatim %}
      <option v-for="off in currentOfferings" :key="off.id" :value="String(off.id)">
        {{ off.year }}
      </option>
      {% endverbatim %}
    </select>
  </div>
  <div class="score-board">
    <div class="score-column">
      <h5>予習レポート</h5>
      <div>
        <div v-for="(item, i) in pre" :key="i" class="scoring-ticket">
          <input v-model="item.label" placeholder="項目名">
          <input type="number" v-model.number="item.weight" placeholder="係数" style="width:80px;margin-left:8px;">
          <label class="ms-2 d-flex align-items-center gap-1">
            <input type="checkbox" v-model="item.show_in_grading_form">
            <span class="small">採点画面に表示</span>
          </label>
          <span v-if="!item.is_system" class="delete-btn" @click="pre.splice(i,1)">×</span>
          <span v-else class="badge bg-secondary ms-2">system</span>
        </div>
        <button class="btn btn-outline-secondary add-btn" @click="addPreItem">＋項目追加</button>
      </div>
    </div>
    <div class="board-divider"></div>
    <div class="score-column">
      <h5>本レポート</h5>
      <div>
        <div v-for="(item, i) in main" :key="i" class="scoring-ticket">
          <input v-model="item.label" placeholder="項目名">
          <input type="number" v-model.number="item.weight" placeholder="係数" style="width:80px;margin-left:8px;">
          <label class="ms-2 d-flex align-items-center gap-1">
            <input type="checkbox" v-model="item.show_in_grading_form">
            <span class="small">採点画面に表示</span>
          </label>
          <span v-if="!item.is_system" class="delete-btn" @click="main.splice(i,1)">×</span>
          <span v-else class="badge bg-secondary ms-2">system</span>
        </div>
        <button class="btn btn-outline-secondary add-btn" @click="addMainItem">＋項目追加</button>
      </div>
    </div>
  </div>
    <div class="mt-3">
      <button class="btn btn-primary" @click="save">保存</button>
    </div>
  </div>
</div>

<script>
  window.csrfToken = '{{ csrf_token }}';
  window.initialPre = {{ pre | safe }};
  window.initialMain = {{ main | safe }};
  window.courses = {{ courses_json | safe }};
  window.selectedCourseId = '{{ selected_course_id }}';
  window.selectedScope = '{{ selected_offering_id }}';
</script>
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script src="{% static 'submission/js/scoring_items.js' %}"></script>
{% endblock %}
