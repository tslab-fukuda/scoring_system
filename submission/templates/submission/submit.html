{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'submission/css/submit_preview.css' %}">
{% endblock %}

{% block content %}
<div id="vue-submit-app" class="container py-4">
  <div v-if="submitting" class="submit-processing-overlay" role="alert" aria-live="assertive">
    <div class="submit-processing-panel">
      <div class="submit-processing-spinner" aria-hidden="true"></div>
      <div class="submit-processing-title">提出処理中...</div>
      <div class="submit-processing-text">画面を閉じずにお待ちください。</div>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="submit-form-box border rounded-3 p-4 mb-4 bg-white" v-bind:class="{ 'submit-busy': submitting }">
        <h4 class="mb-3">課題提出フォーム</h4>
        <form @submit.prevent class="mb-3">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_report_type">レポート種別</label>
            <select v-model="reportType" id="report_type" name="report_type" class="form-control" required v-bind:disabled="submitting">
              <option value="">選択してください</option>
              <option value="main">本レポート</option>
              <option value="prep">予習レポート</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="id_experiment_number">実験番号</label>
            {% verbatim %}
            <select v-model="experimentNumber" id="experiment_number" name="experiment_number" class="form-control" required v-bind:disabled="submitting">
              <option value="">選択してください</option>
              <option v-for="exp in experimentOptions" :value="exp">{{ exp }}</option>
            </select>
            {% endverbatim %}
          </div>
          <div class="mb-3">
            <label for="file" class="form-label">PDFファイル選択</label>
            <input id="file" name="file" type="file" accept="application/pdf" class="form-control"
                   v-on:change="onFileChange" v-bind:disabled="submitting">
          </div>
          <input type="hidden" name="date" value="{{ date }}">
          <input type="hidden" name="offering_id" value="{{ offering_id }}">
        </form>
      </div>

      <div v-if="pdfUrl" class="pdf-preview-area border rounded-3 p-3 bg-light" v-bind:class="{ 'submit-busy': submitting }">
        <div class="mb-2 fw-semibold">PDFプレビュー</div>
        <div id="pdf-preview-container" class="pdf-preview-scroll mb-2"></div>
        <button type="button" class="btn btn-success w-100 mt-2"
                v-bind:disabled="!scrollAtEnd || submitting"
                v-on:click="onConfirm">
          <span v-if="submitting">提出中...</span>
          <span v-else>提出確定</span>
        </button>
        <div v-if="!scrollAtEnd" class="text-secondary small text-center mt-1">
          PDFを最後まで表示すると提出確定できます
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PDF.js CDN -->
{{ experiment_options|json_script:"experiment-options-data" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script src="{% static 'submission/js/submit.js' %}"></script>
{% endblock %}
