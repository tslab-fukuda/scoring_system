<nav class="ts-header">
  <button class="burger-menu ts-burger-menu" type="button" @click="toggleMenu">
    <span :class="{ open: showMenu }"></span>
    <span :class="{ open: showMenu }"></span>
    <span :class="{ open: showMenu }"></span>
  </button>
  <span class="ts-header-title">情報工学実験　管理システム</span>
  <span v-if="overrideActive" class="view-as-indicator">閲覧ロール: {{ viewRoleLabel }}</span>
  <!-- <sub class="subtitle">presented by TSlab</sub> -->
  <button class="dark-toggle" type="button" @click="toggleDark">
    <span v-if="isDark">🌞</span>
    <span v-else>🌙</span>
  </button>
  <transition name="fade">
    <div v-if="showMenu" class="menu-overlay" @click="closeMenu">
      <aside class="menu-panel glass" @click.stop>
        <ul class="menu-list">
          <a href="{% url 'index_redirect' %}" class="menu-link">
            <span class="menu-ico">🏠</span> ダッシュボード
          </a>
          <template v-if="role === 'admin'">
            <li><a href="{% url 'user_list' %}" class="menu-link"><span class="menu-ico">👤</span> ユーザ一覧</a></li>
            <li><a href="{% url 'final_score_list' %}" class="menu-link"><span class="menu-ico">📝</span> 最終成績一覧</a></li>
            <li><a href="{% url 'scoring_items' %}" class="menu-link"><span class="menu-ico">✔</span> 採点項目編集</a></li>
            <li><a href="{% url 'stamp_list' %}" class="menu-link"><span class="menu-ico">🔖</span> スタンプ管理</a></li>
            <li><a href="{% url 'course_management' %}" class="menu-link"><span class="menu-ico">📚</span> 科目/年度管理</a></li>
            <li><a href="/attendance/list/" class="menu-link"><span class="menu-ico">🕒</span> 出席確認</a></li>
          </template>
          <template v-else-if="role === 'teacher' || role === 'non-editing teacher'">
            <li><a href="/attendance/list/" class="menu-link"><span class="menu-ico">🕒</span> 出席確認</a></li>
          </template>
          <!-- <template v-else>
            <li><span class="menu-link disabled"><span class="menu-ico">🙍</span>（メニュー例）</span></li>
          </template> -->
          <li class="divider"></li>
          <li class="user-label">
            <a href="/submission/user_profile/" class="menu-link">
              <span class="menu-ico">🙍</span> プロフィール
            </a>
          </li>
          <li v-if="actualRole === 'admin'" class="view-as-section">
            <div class="view-as-label">閲覧ロール切替</div>
            <div class="view-as-controls">
              <select v-model="viewRole" class="form-select form-select-sm">
                <option value="admin">admin</option>
                <option value="teacher">teacher</option>
                <option value="non-editing teacher">non-editing teacher</option>
                <option value="student">student</option>
              </select>
              <button class="btn btn-sm btn-outline-primary" @click="applyViewRole">切替</button>
            </div>
            <div v-if="overrideActive" class="view-as-note">現在: {{ viewRoleLabel }}</div>
          </li>
          <li>
            <form method="post" action="{% url 'logout' %}" style="margin:0; padding:0; display:inline;">
              {% csrf_token %}
              <button type="submit" class="menu-link logout-link"
                style="background:none; border:none; color:#be2340; font-weight:bold; padding:0;">
                <span class="menu-ico">🚪</span> ログアウト
              </button>
            </form>
          </li>
        </ul>
      </aside>
    </div>
  </transition>
</nav>
