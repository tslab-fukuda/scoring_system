{% verbatim %}
<div class="schedule-section">
    <h4>あなたの実験スケジュール</h4>
    <div class="ts-schedule-grid">
        <div v-for="item in filteredScheduleList" :key="item.id" class="card st-schedule-card"
            :class="isPast(item.date) ? 'past-card' : 'future-card'"
            :aria-disabled="isPast(item.date) ? 'true' : 'false'"
            @click="!isPast(item.date) && goToSubmit(item)">
            <span class="badge bg-primary">{{ item.day_of_week }}</span>
            <div class="fw-bold mb-1" v-text="formatMonthDay(item.date)"></div>
        </div>
        <div v-if="filteredScheduleList.length === 0" class="text-muted">
            実験スケジュールがありません
        </div>
    </div>
</div>
{% endverbatim %}
