{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'submission/css/fade.css' %}">
    <link rel="stylesheet" href="{% static 'submission/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'submission/css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'submission/css/dark_mode.css' %}">
    <link rel="stylesheet" href="{% static 'submission/css/responsive.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="vue-header-app">
        {% include 'submission/header.html' %}
    </div>
    <div id="content-wrap">
        {% block content %}{% endblock %}
    </div>
    <div id="footer-area">{% include 'submission/footer.html' %}</div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script>
        // Djangoのユーザー情報をグローバルJS変数にしてheader.jsで参照
        var USER_NAME = "{{ request.user.get_full_name|default:request.user.username }}";
        var USER_ROLE = "{{ effective_role }}";
        var ACTUAL_ROLE = "{{ actual_role }}";
        var ROLE_OVERRIDE = "{{ role_override }}";
        var USER_IS_AUTHENTICATED = {{ request.user.is_authenticated|yesno:"true,false" }};
        var CSRF_TOKEN = "{{ csrf_token }}";
        var INDEX_URL = "{% url 'index_redirect' %}";
    </script>
    <script src="{% static 'submission/js/header.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
