server {
    listen 80;
    server_name ceexp.nu-tf-lab.jp;

    client_max_body_size 50M;

    location /static/ {
        alias /home/ceexpii/scoring_system/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        include proxy_params;
        proxy_pass http://unix:/run/scoring-system/scoring-system.sock;
        proxy_cache off;
    }

    location /_private_media/ {
        internal;
        alias /home/ceexpii/scoring_system/media/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/scoring-system/scoring-system.sock;
        proxy_read_timeout 300;
    }
}
